title: SuaraKami - Made for Indonesia
description: >-
  SuaraKami adalah sebuah inisiatif non-profit diaspora muda Indonesia yang berpusat di Aachen, Jerman. Kami bergerak dalam lingkup demokrasi dan berdedikasi di bidang pendidikan kebijakan publik.
hero:
  title: Ruang bagi orang Indonesia untuk berpikir lantang.
  description: >-
    SuaraKami adalah inisiatif non-profit diaspora muda Indonesia yang berpusat di Aachen, Jerman. Kami bergerak di bidang demokrasi dan pendidikan kebijakan publik lewat diskusi terbuka, bukan ceramah.
  link:
    label: Lihat kegiatan kami
    to: '#events'
    target: _self
about: >
  Kami lahir dari kebutuhan yang sederhana: ruang yang aman dan terbuka, tempat gagasan bisa dibagikan secara bebas, rasa ingin tahu dihargai, dan perbedaan pandangan bertemu lewat diskusi yang sehat dan saling menghargai.


  Tujuan kami jelas: memperkuat kehidupan bermasyarakat dari bawah ke atas dan ikut membentuk Indonesia yang lebih adil dan partisipatif.


  Dengan semangat gotong royong, kami berusaha tetap idealis tanpa kehilangan pijakan, berpihak pada kepentingan publik, dan percaya bahwa perubahan dimulai dari pikiran terbuka dan usaha bersama.
method:
  lead: Tanpa pengurus inti, tanpa jabatan tetap. Siapa yang sedang punya waktu, dia yang ambil peran.
  body: >
    Sebagian besar kegiatan kami berupa forum: diskusi terbuka, seminar, dan obrolan komunitas yang mencoba membedah sebuah isu publik sampai ke akarnya. Di sini perbedaan pandangan bukan untuk dimenangkan, melainkan untuk dipahami dari mana ia berangkat.


    Tidak ada pengurus inti atau jabatan tetap. Tim kerja dibentuk ketika sebuah acara disepakati, dan lebur kembali setelah acara selesai. Siapa yang sedang punya waktu, dia yang ambil peran.


    Keputusan diambil lewat musyawarah, bukan hitung suara. Siapa pun boleh memulai sesuatu selama punya ide dan waktu untuk menjalankannya. Tidak ada kewajiban untuk selalu aktif. Sibuk sebulan lalu menghilang sebulan itu wajar, dan tidak apa-apa.
