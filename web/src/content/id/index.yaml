title: SuaraKami - Made for Indonesia
description: >-
  SuaraKami adalah sebuah inisiatif non-profit diaspora muda Indonesia yang berpusat di Aachen, Jerman. Kami bergerak dalam lingkup demokrasi dan berdedikasi di bidang pendidikan kebijakan publik.
hero:
  title: Ruang untuk terus membicarakan demokrasi di rumah.
  description: >-
    Kami berkumpul sejak 2018, bermula dari satu pertanyaan. Apa peran kita ketika demokrasi di rumah sedang tidak baik-baik saja?
  link:
    label: Lihat acara kami
    to: '#events'
    target: _self
about: >
  SuaraKami bermula dari percakapan larut malam di antara mahasiswa perantau yang pikirannya tak pernah benar-benar lepas dari rumah.


  Kami tidak punya jawaban yang rapi. Yang kami punya adalah ruang untuk terus membicarakannya bersama: tempat gagasan dibagikan, rasa ingin tahu dihargai, dan perbedaan pandangan bertemu tanpa harus ada yang menang.


  Kami lahir di Aachen pada 2018. Sejak itu kami belajar bahwa perubahan jarang datang dari keriuhan. Lebih sering ia datang dari kerja sunyi yang konsisten, dan dari kebersamaan yang sederhana: makan bersama, tertawa bersama, saling mendengar.
method:
  lead: Waktu kami tidak pernah sama dan selalu berubah. Cara kami bekerja mengikuti kenyataan itu.
  body: >
    Kegiatan kami kebanyakan berupa diskusi: forum terbuka, seminar, obrolan santai. Perbedaan pendapat di sana bukan untuk dimenangkan, tapi untuk dipahami.


    Tidak ada pengurus tetap. Kalau ada acara yang disepakati, yang sedang sempat mengerjakannya bersama. Selesai acara, selesai juga timnya.


    Keputusan diambil lewat musyawarah, dan siapa pun boleh mengusulkan sesuatu. Sibuk sebulan lalu menghilang sebulan itu biasa, dan tidak apa-apa.
