title: SuaraKami - Made for Indonesia
description: >-
  SuaraKami adalah komunitas kecil di Aachen, Jerman, yang sejak 2018 berkumpul untuk membicarakan demokrasi di Indonesia lewat forum terbuka, seminar, dan obrolan sambil ngopi.
hero:
  title: Ruang untuk terus membicarakan demokrasi di rumah.
  description: >-
    Kami segelintir orang di Aachen yang sudah berkumpul sejak 2018, berawal dari satu pertanyaan yang sampai sekarang masih kami bawa: apa peran kita ketika demokrasi di rumah sedang tidak baik-baik saja?
  link:
    label: Lihat acara kami
    to: '#events'
    target: _self
about: >
  Kami sekumpulan perantau yang punya satu kesamaan: pikiran yang sering pulang ke Indonesia.


  Semuanya bermula dari obrolan larut malam beberapa mahasiswa di Aachen pada 2018, dan karena tidak pernah ada jawaban yang rapi, obrolan itu terus berlanjut sampai sekarang bersama siapa pun yang mau datang. Kalau ada yang bertahan dari semua itu, mungkin justru hal-hal sederhananya: makan bersama, tertawa bersama, saling mendengar.
method:
  lead: Waktu luang kami tidak pernah sama dan selalu berubah, jadi cara kami bekerja pun menyesuaikan dengan itu.
  body: >
    Kegiatan kami kebanyakan berupa diskusi, entah itu forum terbuka, seminar, atau sekadar ngobrol sambil ngopi.


    Tidak ada pengurus tetap, jadi kalau ada ide acara yang disepakati, siapa yang sedang sempat ikut mengerjakannya, dan begitu acaranya selesai timnya pun bubar.


    Siapa pun boleh mengusulkan sesuatu dan keputusan diambil dengan ngobrol bersama, sementara aktif sebulan lalu menghilang sebulan karena kuliah atau kerja itu biasa saja dan tidak apa-apa.
