title: SuaraKami - Made for Indonesia
description: >-
  SuaraKami is a non-profit initiative of young Indonesian diaspora based in Aachen, Germany, working on democracy and public-policy education.
hero:
  title: A space to keep talking about democracy back home.
  description: >-
    We have been meeting since 2018, starting from one question. What is our role when democracy back home is struggling?
  link:
    label: See our events
    to: '#events'
    target: _self
about: >
  SuaraKami began as late-night conversations among students abroad whose minds never quite left home.


  We do not have a tidy answer. What we have is a place to keep asking it together: where ideas can be shared, curiosity is welcome, and differing views can meet without anyone having to win.


  We started in Aachen in 2018. Since then we have learned that change rarely comes from noise. More often it comes from quiet, steady work, and from eating and laughing together.
method:
  lead: None of us has the same amount of time, and it keeps changing. The way we work follows from that.
  body: >
    Most of what we do is talking: open forums, seminars, casual conversations. Disagreements there are not for winning, only for understanding.


    There is no permanent committee. When an event is agreed on, whoever is free at the time works on it together. When the event ends, so does the team.


    Decisions are made by talking it through, and anyone can propose something. Being busy one month and gone the next is normal, and fine.
