title: SuaraKami - Made for Indonesia
description: >-
  SuaraKami is a small community in Aachen, Germany, that has been getting together since 2018 to talk about democracy in Indonesia through open forums, seminars, and chats over coffee.
hero:
  title: A space to keep talking about democracy back home.
  description: >-
    We are a handful of people in Aachen who have been meeting since 2018, starting from one question we still carry around: what is our role when democracy back home is struggling?
  link:
    label: See our events
    to: '#events'
    target: _self
about: >
  We are people living far from Indonesia with one thing in common: our minds keep going back there.


  It started with a few late-night conversations among students in Aachen in 2018, and since there was never a tidy answer, the conversation has simply kept going with whoever wants to come along. If anything has lasted from all of it, it is probably the simple things: eating together, laughing together, listening to each other.
method:
  lead: None of us has the same free time and it keeps changing, so the way we work has to bend around that.
  body: >
    Most of what we do is talk, whether in an open forum, a seminar, or just a chat over coffee.


    There is no permanent committee, so when we agree on an event, whoever has time that month helps make it happen, and once it is over the team dissolves with it.


    Anyone can suggest something and decisions are made by talking it through, while being active one month and gone the next because of studies or work is perfectly normal and fine.
