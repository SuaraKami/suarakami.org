title: SuaraKami - Made for Indonesia
description: >-
  SuaraKami is a non-profit initiative of young Indonesian diaspora based in Aachen, Germany, working on democracy and public-policy education.
hero:
  title: A room for Indonesians to think out loud.
  description: >-
    SuaraKami is a non-profit initiative of young Indonesian diaspora, based in Aachen, Germany. We work on democracy and public-policy education through open discussion, not lectures.
  link:
    label: See what we do
    to: '#events'
    target: _self
about: >
  We were born out of a simple need: a safe and open space where ideas can be shared freely, curiosity is encouraged, and disagreement grows into thoughtful, constructive debate.


  Our goal is to strengthen the public from the ground up and contribute to a fairer, more participatory Indonesia.


  Rooted in the spirit of gotong royong, we stay idealistic yet pragmatic, always on the side of the public, and convinced that change begins with open minds and collective effort.
method:
  lead: No board, no fixed roles. Whoever has the time steps in.
  body: >
    Most of what we do takes the form of a forum: open discussions, seminars, and community conversations that try to get to the root of a public issue. Disagreement here is not something to win. It is something to understand, starting from where the other person begins.


    There is no board and no fixed roles. A team forms when an event is agreed on, and dissolves again once it is over. Whoever has the time at that point takes it on.


    Decisions are made by talking things through until no one has a fundamental objection, not by counting votes. Anyone can start something if they have the idea and the time to carry it. There is no duty to always be around. Being active one month and absent the next is normal, and fine.
